<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Sami Aridal</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

</head>
<body class="is-transitioning">
    <div class="cursor"></div>
    <div class="page-transition-overlay"></div>

    <header class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo magnetic-item">Sami Aridal</a>
            <nav class="nav-menu">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>

                    <li><a href="contact.html">Contact</a></li>

            </nav>
            <button class="hamburger" id="hamburger-menu" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>

    <main>
        <section class="content-section">
            <div class="container article-content" id="article-detail-container" data-aos="fade-up">

                <div id="article-body"></div>
                <a href="#" id="article-source-url" class="btn-link" target="_blank">Read original on <span id="article-source-name"></span> →</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
